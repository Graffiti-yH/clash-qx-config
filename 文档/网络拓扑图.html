  <div class="notes">
    <strong>节点选择约束：</strong>AI 自动组只在美国节点内选择；社交自动组只在日本节点内选择；YouTube 自动组只在香港/台湾节点内选择；只有“其他海外—自动”允许全部国家节点参与。<br>
    <strong>配置入口：</strong><code>Clash/配置模板.yaml</code>、<code>Quantumult X/配置模板.conf</code>；真实订阅需在客户端本地添加。
