# Quantumult X 配置模板
# 中文说明；Quantumult X 字段名必须保留英文。
# 真实订阅请在 Quantumult X 应用内添加，不要写入公开仓库。

[general]
# 兼容性优先，按需替换为你实际测试通过的 DNS。
dns-server = system, 223.5.5.5, 1.1.1.1
excluded-routes = 192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4

[server_remote]
# 请在 App 中添加真实订阅；不要取消注释并提交真实 URL。
# https://你的订阅链接 = tag=订阅节点, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/人工智能.list, tag=人工智能, force-policy=AI—手动—美国, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/社交软件.list, tag=社交软件, force-policy=社交—手动—日本, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/流媒体.list, tag=流媒体, force-policy=流媒体—手动—港澳台, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/中国大陆直连.list, tag=中国大陆直连, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/局域网直连.list, tag=局域网直连, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Quantumult%20X/广告拦截.list, tag=广告拦截, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true

[policy]
# 将下列策略组中的节点替换为订阅中的实际节点。
static = AI—手动—美国, 美国节点01, 美国节点02, reject
static = 社交—手动—日本, 日本节点01, 日本节点02, reject
static = 流媒体—手动—港澳台, 香港节点01, 台湾节点01, reject
url-latency-benchmark = AI—自动—美国, 美国节点01, 美国节点02, check-interval=300, tolerance=80
url-latency-benchmark = 社交—自动—日本, 日本节点01, 日本节点02, check-interval=300, tolerance=80
url-latency-benchmark = 流媒体—自动—港澳台, 香港节点01, 台湾节点01, check-interval=300, tolerance=80
url-latency-benchmark = 其他海外—自动, 美国节点01, 日本节点01, 香港节点01, 台湾节点01, check-interval=300, tolerance=80
static = 其他海外—手动, 其他海外—自动, reject
static = 未命中—阻断, reject

[rewrite_local]
# 平衡模式不默认启用 MITM/Rewrite。
# 如后续确需脚本或重写，请单独新增，并排除银行、支付、微信、QQ 等敏感域名。

[mitm]
# 不在模板中启用证书或 hostname，避免误解密敏感流量。

[filter]
# 规则顺序：局域网 → 广告 → 中国大陆 → 分类代理 → 海外兜底阻断
ip-cidr,192.168.0.0/16,direct,no-resolve
ip-cidr,172.16.0.0/12,direct,no-resolve
ip-cidr,10.0.0.0/8,direct,no-resolve
geoip,cn,direct
final,其他海外—手动
