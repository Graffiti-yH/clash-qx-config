# Clash for Apple / Mihomo 纯分流配置
# 不包含任何订阅链接和节点；节点可通过 Hako“覆写”或代理提供商加入。
# 策略组使用 include-all: true，会自动接收后续加入的代理节点。

mode: rule
log-level: warning
ipv6: false

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  fallback:
    - https://8.8.8.8/dns-query
    - https://1.0.0.1/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

proxy-groups:
  - name: AI—自动—美国
    type: url-test
    include-all: true
    filter: "(?i)(美国|US|USA|United States|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|Silicon Valley)"
    proxies: [REJECT]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: AI—手动—美国
    type: select
    include-all: true
    filter: "(?i)(美国|US|USA|United States|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|Silicon Valley)"
    proxies: [AI—自动—美国, REJECT]

  - name: 社交—自动—日本
    type: url-test
    include-all: true
    filter: "(?i)(日本|JP|Japan|Tokyo|Osaka)"
    proxies: [REJECT]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 社交—手动—日本
    type: select
    include-all: true
    filter: "(?i)(日本|JP|Japan|Tokyo|Osaka)"
    proxies: [社交—自动—日本, REJECT]

  - name: 流媒体—自动—港澳台
    type: url-test
    include-all: true
    filter: "(?i)(香港|HK|Hong Kong|台湾|TW|Taiwan|台灣)"
    proxies: [REJECT]
    url: https://www.youtube.com/generate_204
    interval: 300
    tolerance: 80

  - name: 流媒体—手动—港澳台
    type: select
    include-all: true
    filter: "(?i)(香港|HK|Hong Kong|台湾|TW|Taiwan|台灣)"
    proxies: [流媒体—自动—港澳台, REJECT]

  - name: 其他海外—自动
    type: url-test
    include-all: true
    proxies: [REJECT]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 其他海外—手动
    type: select
    include-all: true
    proxies: [其他海外—自动, REJECT]

  - name: 未命中—阻断
    type: select
    proxies: [REJECT]

rule-providers:
  人工智能:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/人工智能.list
    path: ./rules/人工智能.list
    interval: 86400
  社交软件:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/社交软件.list
    path: ./rules/社交软件.list
    interval: 86400
  流媒体:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/流媒体.list
    path: ./rules/流媒体.list
    interval: 86400
  中国大陆直连:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/中国大陆直连.list
    path: ./rules/中国大陆直连.list
    interval: 86400
  局域网直连:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/局域网直连.list
    path: ./rules/局域网直连.list
    interval: 86400
  广告拦截:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/广告拦截.list
    path: ./rules/广告拦截.list
    interval: 86400

rules:
  - RULE-SET,局域网直连,DIRECT
  - RULE-SET,广告拦截,REJECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - RULE-SET,中国大陆直连,DIRECT
  - RULE-SET,人工智能,AI—手动—美国
  - RULE-SET,社交软件,社交—手动—日本
  - RULE-SET,流媒体,流媒体—手动—港澳台
  - MATCH,其他海外—手动
