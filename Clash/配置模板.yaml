# Clash for Apple / Mihomo 配置模板
# 中文说明；Clash/Mihomo 的字段名必须保留英文。
# 公开仓库不放真实订阅。请先在应用中添加订阅，并将其名称与“订阅节点”对应。

mode: rule
log-level: warning
ipv6: false

# 仅当前设备生效，不配置路由器网关。
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 兼容性优先：先使用 redir-host。若个别应用需要，可在本地测试 fake-ip。
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  fallback:
    - https://8.8.8.8/dns-query
    - https://1.0.0.1/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - system
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

# 本地配置时，将真实订阅绑定为“订阅节点”。不要把真实 URL 提交到本仓库。
proxy-providers:
  订阅节点:
    type: http
    url: "请在本地替换为真实订阅链接"
    path: ./providers/订阅节点.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: AI—自动—美国
    type: url-test
    use: [订阅节点]
    filter: "(?i)(美国|US|USA|United States|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|Silicon Valley)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: AI—手动—美国
    type: select
    proxies: [AI—自动—美国, REJECT]
    use: [订阅节点]
    filter: "(?i)(美国|US|USA|United States|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|Silicon Valley)"

  - name: 社交—自动—日本
    type: url-test
    use: [订阅节点]
    filter: "(?i)(日本|JP|Japan|Tokyo|Osaka|Japan)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 社交—手动—日本
    type: select
    proxies: [社交—自动—日本, REJECT]
    use: [订阅节点]
    filter: "(?i)(日本|JP|Japan|Tokyo|Osaka)"

  - name: 流媒体—自动—港澳台
    type: url-test
    use: [订阅节点]
    filter: "(?i)(香港|HK|Hong Kong|台湾|TW|Taiwan|台灣)"
    url: https://www.youtube.com/generate_204
    interval: 300
    tolerance: 80

  - name: 流媒体—手动—港澳台
    type: select
    proxies: [流媒体—自动—港澳台, REJECT]
    use: [订阅节点]
    filter: "(?i)(香港|HK|Hong Kong|台湾|TW|Taiwan|台灣)"

  - name: 其他海外—自动
    type: url-test
    use: [订阅节点]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 其他海外—手动
    type: select
    proxies: [其他海外—自动, REJECT]
    use: [订阅节点]

  - name: 未命中—阻断
    type: select
    proxies: [REJECT]

rule-providers:
  人工智能:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/人工智能.list
    path: ./rules/人工智能.list
    interval: 86400
  社交软件:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/社交软件.list
    path: ./rules/社交软件.list
    interval: 86400
  流媒体:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/流媒体.list
    path: ./rules/流媒体.list
    interval: 86400
  中国大陆直连:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/中国大陆直连.list
    path: ./rules/中国大陆直连.list
    interval: 86400
  局域网直连:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/局域网直连.list
    path: ./rules/局域网直连.list
    interval: 86400
  广告拦截:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Graffiti-yH/clash-qx-config/main/规则/Clash/广告拦截.list
    path: ./rules/广告拦截.list
    interval: 86400

rules:
  - RULE-SET,局域网直连,DIRECT
  - RULE-SET,广告拦截,REJECT
  - RULE-SET,中国大陆直连,DIRECT
  - RULE-SET,人工智能,AI—手动—美国
  - RULE-SET,社交软件,社交—手动—日本
  - RULE-SET,流媒体,流媒体—手动—港澳台
  - MATCH,其他海外—手动
